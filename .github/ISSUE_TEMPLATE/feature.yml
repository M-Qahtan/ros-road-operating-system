name: Product capability
description: Propose an MVP capability with measurable acceptance criteria
title: "[Capability] "
labels: ["product"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: User or operational outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: dropdown
    id: safety
    attributes:
      label: Safety criticality
      options: [P0-critical, P1-important, P2-later]
    validations:
      required: true
