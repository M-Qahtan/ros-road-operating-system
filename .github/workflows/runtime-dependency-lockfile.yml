name: Runtime Dependency Lockfile Generator

on:
  push:
    branches:
      - agent/runtime-production-readiness
    paths:
      - .github/workflows/runtime-dependency-lockfile.yml

permissions:
  contents: write

concurrency:
  group: runtime-dependency-lockfile-generator
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'M-Qahtan/ros-road-operating-system' && github.ref == 'refs/heads/agent/runtime-production-readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/runtime-production-readiness
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pinned package manager
        run: corepack enable

      - name: Generate production runtime dependency manifest and lockfile
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @ros/api add pg redis
          pnpm --filter @ros/api add --save-dev @types/pg
          pnpm install --lockfile-only

      - name: Restrict generated change surface
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(apps/api/package.json|pnpm-lock.yaml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected generated files:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git diff --check -- apps/api/package.json pnpm-lock.yaml
          test -n "$(git status --porcelain -- apps/api/package.json pnpm-lock.yaml)"

      - name: Commit generated manifest and lockfile to draft branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ros-lockfile-bot"
          git config user.email "ros-lockfile-bot@users.noreply.github.com"
          git add apps/api/package.json pnpm-lock.yaml
          git commit -m "build(runtime): add postgres and redis client dependencies"
          git push origin HEAD:agent/runtime-production-readiness
