name: Dashboard diagnostic
on:
  pull_request:
    paths:
      - 'apps/operations-dashboard/**'
      - 'packages/contracts/**'
      - 'pnpm-lock.yaml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Capture dashboard checks
        run: |
          set +e
          pnpm --filter @ros/operations-dashboard lint > dashboard-check.txt 2>&1
          lint_status=$?
          pnpm --filter @ros/operations-dashboard build >> dashboard-check.txt 2>&1
          build_status=$?
          pnpm --filter @ros/operations-dashboard test >> dashboard-check.txt 2>&1
          test_status=$?
          cat dashboard-check.txt
          printf 'lint=%s\nbuild=%s\ntest=%s\n' "$lint_status" "$build_status" "$test_status" > dashboard-check-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-check-diagnostic
          path: |
            dashboard-check.txt
            dashboard-check-status.txt
