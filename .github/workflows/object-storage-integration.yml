name: Object Storage Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: object-storage-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_EVIDENCE_SCHEMA: ros-ci-evidence/v3
  CI_EVIDENCE_RETENTION_DAYS: '365'
  CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CANDIDATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
  TESTED_MERGE_SHA: ${{ github.sha }}
  NODE_ENV: test
  DATABASE_URL: postgresql://ros:object-storage-integration-only@localhost:5432/ros
  PGPASSWORD: object-storage-integration-only
  OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9000
  OBJECT_STORAGE_REGION: us-east-1
  OBJECT_STORAGE_BUCKET: ros-evidence
  OBJECT_STORAGE_ACCESS_KEY: ros-object-storage-ci
  OBJECT_STORAGE_SECRET_KEY: ros-object-storage-ci-secret

jobs:
  object-storage-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ros
          POSTGRES_PASSWORD: object-storage-integration-only
          POSTGRES_DB: ros
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ros -d ros"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out tested candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Enable package manager
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Provide PostgreSQL client from pinned service image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime-ci-bin
          cat > .runtime-ci-bin/psql <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm --network host \
            -v "$PWD:/workspace:ro" \
            -w /workspace \
            -e PGPASSWORD="${PGPASSWORD:-}" \
            postgis/postgis:16-3.4 \
            psql "$@"
          EOF
          chmod +x .runtime-ci-bin/psql
          echo "$PWD/.runtime-ci-bin" >> "$GITHUB_PATH"
      - name: Apply migrations and database invariants
        run: bash scripts/run-postgres-integration.sh
      - name: Start isolated MinIO
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm \
            --name ros-object-storage-ci \
            -p 9000:9000 \
            -e MINIO_ROOT_USER="$OBJECT_STORAGE_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$OBJECT_STORAGE_SECRET_KEY" \
            minio/minio:RELEASE.2025-07-23T15-54-02Z \
            server /data
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs ros-object-storage-ci || true
          exit 1
      - name: Create isolated evidence bucket with pinned MinIO client
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            --entrypoint /bin/sh \
            -e MINIO_ROOT_USER="$OBJECT_STORAGE_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$OBJECT_STORAGE_SECRET_KEY" \
            minio/mc:RELEASE.2025-07-21T05-28-08Z \
            -c 'mc alias set ros-ci http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null && mc mb --ignore-existing ros-ci/ros-evidence'
      - name: Build API and dependencies
        run: pnpm --filter @ros/api... build
      - name: Prove scoped PostgreSQL EvidenceService with MinIO
        shell: bash
        run: |
          set -euo pipefail
          node apps/api/dist/e2e/run-object-storage-integration.js 2>&1 | tee object-storage-integration.log
          grep -q '"status":"PASS"' object-storage-integration.log
          grep -q '"postgresEvidencePersisted":true' object-storage-integration.log
          grep -q '"roadEventScopeVerified":true' object-storage-integration.log
          grep -q '"uploadChecksumVerified":true' object-storage-integration.log
          grep -q '"crossTenantEvidenceHidden":true' object-storage-integration.log
      - name: Write object-storage evidence manifest
        if: always()
        shell: bash
        run: |
          cat > object-storage-integration-evidence.json <<EOF
          {
            "schema": "${CI_EVIDENCE_SCHEMA}",
            "job": "object-storage-integration",
            "repository": "${GITHUB_REPOSITORY}",
            "workflow": "${GITHUB_WORKFLOW}",
            "event": "${GITHUB_EVENT_NAME}",
            "ref": "${GITHUB_REF}",
            "candidate_head_sha": "${CANDIDATE_HEAD_SHA}",
            "candidate_base_sha": "${CANDIDATE_BASE_SHA}",
            "tested_merge_sha": "${TESTED_MERGE_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "retention_days": "${CI_EVIDENCE_RETENTION_DAYS}"
          }
          EOF
      - name: Validate object-storage evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s object-storage-integration.log
          node scripts/validate-ci-evidence.mjs object-storage-integration-evidence.json object-storage-integration
      - name: Upload object-storage evidence
        if: always()
        id: upload-evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: object-storage-integration-${{ env.CANDIDATE_HEAD_SHA }}-${{ env.TESTED_MERGE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            object-storage-integration.log
            object-storage-integration-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Stop isolated MinIO
        if: always()
        run: docker rm -f ros-object-storage-ci >/dev/null 2>&1 || true
