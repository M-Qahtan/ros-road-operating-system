name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ros
          POSTGRES_PASSWORD: ros-integration-password
          POSTGRES_DB: ros
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ros -d ros"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ros:ros-integration-password@localhost:5432/ros
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate migrations and persistence invariants
        run: bash scripts/run-postgres-integration.sh
      - name: Prove backup and clean restore
        run: |
          createdb -h localhost -U ros ros_restore
          BACKUP_DIR="$RUNNER_TEMP/backups" bash scripts/postgres-backup.sh
          BACKUP_FILE=$(find "$RUNNER_TEMP/backups" -name '*.dump' -type f | head -1)
          RESTORE_DATABASE_URL=postgresql://ros:ros-integration-password@localhost:5432/ros_restore BACKUP_FILE="$BACKUP_FILE" bash scripts/postgres-restore-verify.sh
        env:
          PGPASSWORD: ros-integration-password

  staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_USER: ros
      POSTGRES_PASSWORD: C1RosPgA9x7Lm4Qv2Np8Z
      POSTGRES_DB: ros
      DATABASE_URL: postgresql://ros:C1RosPgA9x7Lm4Qv2Np8Z@postgres:5432/ros
      REDIS_PASSWORD: R7RedisA4x9Lm2Qv8Np6K
      REDIS_URL: redis://:R7RedisA4x9Lm2Qv8Np6K@redis:6379
      MINIO_ROOT_USER: ros-ci
      MINIO_ROOT_PASSWORD: M8MinioA4x9Lm2Qv7Np6K
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ros-ci
      OBJECT_STORAGE_SECRET_KEY: O9ObjectA4x7Lm2Qv8Np6Kz5Ty3
      OBJECT_STORAGE_BUCKET: ros-evidence
      JWT_SECRET: J4JwtA9x7Lm2Qv8Np6Kz5Ty3Rs1Bc0De
    steps:
      - uses: actions/checkout@v4
      - name: Validate secrets and compose configuration
        run: |
          bash scripts/validate-environment.sh
          docker compose -f infrastructure/docker/docker-compose.yml config --quiet
      - name: Start dependency and application stack
        run: docker compose -f infrastructure/docker/docker-compose.yml up -d --build
      - name: Verify liveness and readiness
        run: |
          for attempt in $(seq 1 30); do curl -fsS http://localhost:3000/health && break || sleep 2; done
          curl -fsS http://localhost:3000/ready
      - name: Show diagnostics on failure
        if: failure()
        run: docker compose -f infrastructure/docker/docker-compose.yml logs --no-color
      - if: always()
        run: docker compose -f infrastructure/docker/docker-compose.yml down -v
