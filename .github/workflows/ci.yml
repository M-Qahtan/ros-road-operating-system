name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_EVIDENCE_SCHEMA: ros-ci-evidence/v1

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Build workspace
        run: pnpm build > build.log 2>&1
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Write verification evidence manifest
        if: always()
        shell: bash
        run: |
          cat > verify-evidence.json <<EOF
          {
            "schema": "${CI_EVIDENCE_SCHEMA}",
            "job": "verify",
            "repository": "${GITHUB_REPOSITORY}",
            "workflow": "${GITHUB_WORKFLOW}",
            "event": "${GITHUB_EVENT_NAME}",
            "ref": "${GITHUB_REF}",
            "commit_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}"
          }
          EOF
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build.log
            verify-evidence.json
          if-no-files-found: error
          retention-days: 30

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ros
          POSTGRES_PASSWORD: ros-integration-password
          POSTGRES_DB: ros
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ros -d ros"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ros:ros-integration-password@localhost:5432/ros
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate migrations and persistence invariants
        run: bash scripts/run-postgres-integration.sh
      - name: Prove backup and clean restore
        run: |
          createdb -h localhost -U ros ros_restore
          BACKUP_DIR="$RUNNER_TEMP/backups" bash scripts/postgres-backup.sh
          BACKUP_FILE=$(find "$RUNNER_TEMP/backups" -name '*.dump' -type f | head -1)
          RESTORE_DATABASE_URL=postgresql://ros:ros-integration-password@localhost:5432/ros_restore BACKUP_FILE="$BACKUP_FILE" bash scripts/postgres-restore-verify.sh
        env:
          PGPASSWORD: ros-integration-password
      - name: Write PostgreSQL evidence manifest
        if: always()
        shell: bash
        run: |
          cat > postgres-integration-evidence.json <<EOF
          {
            "schema": "${CI_EVIDENCE_SCHEMA}",
            "job": "postgres-integration",
            "repository": "${GITHUB_REPOSITORY}",
            "workflow": "${GITHUB_WORKFLOW}",
            "event": "${GITHUB_EVENT_NAME}",
            "ref": "${GITHUB_REF}",
            "commit_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}"
          }
          EOF
      - name: Upload PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-integration-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: postgres-integration-evidence.json
          if-no-files-found: error
          retention-days: 30

  staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_USER: ros
      POSTGRES_PASSWORD: C1RosPgA9x7Lm4Qv2Np8Z
      POSTGRES_DB: ros
      DATABASE_URL: postgresql://ros:C1RosPgA9x7Lm4Qv2Np8Z@postgres:5432/ros
      REDIS_PASSWORD: R7RedisA4x9Lm2Qv8Np6K
      REDIS_URL: redis://:R7RedisA4x9Lm2Qv8Np6K@redis:6379
      MINIO_ROOT_USER: ros-ci
      MINIO_ROOT_PASSWORD: M8MinioA4x9Lm2Qv7Np6K
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ros-ci
      OBJECT_STORAGE_SECRET_KEY: O9ObjectA4x7Lm2Qv8Np6Kz5Ty3Rs8Bc1
      OBJECT_STORAGE_BUCKET: ros-evidence
      JWT_SECRET: J4JwtA9x7Lm2Qv8Np6Kz5Ty3Rs1Bc0De
    steps:
      - uses: actions/checkout@v4
      - name: Validate secrets and compose configuration
        run: |
          bash scripts/validate-environment.sh
          docker compose -f infrastructure/docker/docker-compose.yml config --quiet
      - name: Start dependency and application stack
        run: docker compose -f infrastructure/docker/docker-compose.yml up -d --build
      - name: Verify services, liveness and readiness
        run: |
          for attempt in $(seq 1 20); do
            if timeout 5s docker compose -f infrastructure/docker/docker-compose.yml exec -T api node -e "fetch('http://127.0.0.1:3000/health', {signal: AbortSignal.timeout(2000)}).then(r=>{if(!r.ok)process.exit(1)})"; then
              break
            fi
            if [[ "$attempt" == "20" ]]; then exit 1; fi
            sleep 2
          done
          docker compose -f infrastructure/docker/docker-compose.yml ps --status running --services | sort > "$RUNNER_TEMP/running"
          printf 'api\nminio\npostgres\nredis\n' > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/running"
          timeout 10s docker compose -f infrastructure/docker/docker-compose.yml exec -T api node -e "fetch('http://127.0.0.1:3000/ready', {signal: AbortSignal.timeout(5000)}).then(r=>{if(!r.ok)process.exit(1);return r.text()}).then(console.log)"
      - name: Capture diagnostics
        if: always()
        shell: bash
        run: |
          docker compose -f infrastructure/docker/docker-compose.yml ps > staging-compose-ps.log 2>&1 || true
          docker compose -f infrastructure/docker/docker-compose.yml logs --no-color > staging-compose.log 2>&1 || true
          cat > staging-smoke-evidence.json <<EOF
          {
            "schema": "${CI_EVIDENCE_SCHEMA}",
            "job": "staging-smoke",
            "repository": "${GITHUB_REPOSITORY}",
            "workflow": "${GITHUB_WORKFLOW}",
            "event": "${GITHUB_EVENT_NAME}",
            "ref": "${GITHUB_REF}",
            "commit_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}"
          }
          EOF
      - name: Upload staging smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-smoke-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            staging-compose-ps.log
            staging-compose.log
            staging-smoke-evidence.json
          if-no-files-found: error
          retention-days: 30
      - if: always()
        run: docker compose -f infrastructure/docker/docker-compose.yml down -v

  riyadh-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Run deterministic Riyadh vertical slice
        shell: bash
        run: |
          set -o pipefail
          pnpm simulate:riyadh | tee riyadh-pilot-result.json
      - name: Write Riyadh E2E evidence manifest
        if: always()
        shell: bash
        run: |
          cat > riyadh-e2e-evidence.json <<EOF
          {
            "schema": "${CI_EVIDENCE_SCHEMA}",
            "job": "riyadh-e2e",
            "repository": "${GITHUB_REPOSITORY}",
            "workflow": "${GITHUB_WORKFLOW}",
            "event": "${GITHUB_EVENT_NAME}",
            "ref": "${GITHUB_REF}",
            "commit_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}"
          }
          EOF
      - name: Upload pilot evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riyadh-e2e-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            riyadh-pilot-result.json
            artifacts/riyadh-pilot/result.json
            docs/08-pilot-riyadh/pilot-e2e-readiness.md
            riyadh-e2e-evidence.json
          if-no-files-found: warn
          retention-days: 30
