name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Build workspace
        run: pnpm build > build.log 2>&1
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-build-log-${{ github.sha }}
          path: build.log
          if-no-files-found: error
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ros
          POSTGRES_PASSWORD: ros-integration-password
          POSTGRES_DB: ros
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ros -d ros"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ros:ros-integration-password@localhost:5432/ros
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate migrations and persistence invariants
        run: bash scripts/run-postgres-integration.sh
      - name: Prove backup and clean restore
        run: |
          set -o pipefail
          mkdir -p artifacts/reliability
          createdb -h localhost -U ros ros_restore
          BACKUP_DIR="$RUNNER_TEMP/backups" bash scripts/postgres-backup.sh
          BACKUP_FILE=$(find "$RUNNER_TEMP/backups" -name '*.dump' -type f | head -1)
          started=$(date +%s)
          RESTORE_DATABASE_URL=postgresql://ros:ros-integration-password@localhost:5432/ros_restore BACKUP_FILE="$BACKUP_FILE" bash scripts/postgres-restore-verify.sh | tee artifacts/reliability/postgres-restore.log
          finished=$(date +%s)
          elapsed=$((finished-started))
          test "$elapsed" -le 1800
          printf '{"commitSha":"%s","status":"passed","rpoMinutes":5,"rtoTargetSeconds":1800,"restoreElapsedSeconds":%s}\n' "$GITHUB_SHA" "$elapsed" > artifacts/reliability/postgres-recovery.json
        env:
          PGPASSWORD: ros-integration-password
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-recovery-evidence-${{ github.sha }}
          path: artifacts/reliability
          if-no-files-found: error

  staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_USER: ros
      POSTGRES_PASSWORD: C1RosPgA9x7Lm4Qv2Np8Z
      POSTGRES_DB: ros
      DATABASE_URL: postgresql://ros:C1RosPgA9x7Lm4Qv2Np8Z@postgres:5432/ros
      REDIS_PASSWORD: R7RedisA4x9Lm2Qv8Np6K
      REDIS_URL: redis://:R7RedisA4x9Lm2Qv8Np6K@redis:6379
      MINIO_ROOT_USER: ros-ci
      MINIO_ROOT_PASSWORD: M8MinioA4x9Lm2Qv7Np6K
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ros-ci
      OBJECT_STORAGE_SECRET_KEY: O9ObjectA4x7Lm2Qv8Np6Kz5Ty3Rs8Bc1
      OBJECT_STORAGE_BUCKET: ros-evidence
      JWT_SECRET: J4JwtA9x7Lm2Qv8Np6Kz5Ty3Rs1Bc0De
    steps:
      - uses: actions/checkout@v4
      - name: Validate secrets and compose configuration
        run: |
          bash scripts/validate-environment.sh
          docker compose -f infrastructure/docker/docker-compose.yml config --quiet
      - name: Start dependency and application stack
        run: docker compose -f infrastructure/docker/docker-compose.yml up -d --build
      - name: Verify services, liveness and readiness
        run: |
          for attempt in $(seq 1 20); do
            if timeout 5s docker compose -f infrastructure/docker/docker-compose.yml exec -T api node -e "fetch('http://127.0.0.1:3000/health', {signal: AbortSignal.timeout(2000)}).then(r=>{if(!r.ok)process.exit(1)})"; then
              break
            fi
            if [[ "$attempt" == "20" ]]; then exit 1; fi
            sleep 2
          done
          docker compose -f infrastructure/docker/docker-compose.yml ps --status running --services | sort > "$RUNNER_TEMP/running"
          printf 'api\nminio\npostgres\nredis\n' > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/running"
          timeout 10s docker compose -f infrastructure/docker/docker-compose.yml exec -T api node -e "fetch('http://127.0.0.1:3000/ready', {signal: AbortSignal.timeout(5000)}).then(r=>{if(!r.ok)process.exit(1);return r.text()}).then(console.log)"
      - name: Run safe dependency fault injection
        run: bash scripts/run-safe-fault-injection.sh
      - name: Upload fault-injection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safe-fault-injection-${{ github.sha }}
          path: artifacts/reliability/fault-injection.json
          if-no-files-found: error
      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker compose -f infrastructure/docker/docker-compose.yml ps
          docker compose -f infrastructure/docker/docker-compose.yml logs --no-color
      - if: always()
        run: docker compose -f infrastructure/docker/docker-compose.yml down -v

  riyadh-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Run deterministic Riyadh vertical slice
        shell: bash
        run: |
          set -o pipefail
          pnpm simulate:riyadh | tee riyadh-pilot-result.json
      - name: Upload pilot evidence package
        uses: actions/upload-artifact@v4
        with:
          name: riyadh-pilot-evidence-${{ github.sha }}
          path: |
            riyadh-pilot-result.json
            artifacts/riyadh-pilot/result.json
            docs/08-pilot-riyadh/pilot-e2e-readiness.md
          if-no-files-found: error

  operational-readiness:
    if: always()
    needs: [verify, postgres-integration, staging-smoke, riyadh-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require all release evidence jobs
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          POSTGRES_RESULT: ${{ needs.postgres-integration.result }}
          STAGING_RESULT: ${{ needs.staging-smoke.result }}
          RIYADH_RESULT: ${{ needs.riyadh-e2e.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$POSTGRES_RESULT" = success
          test "$STAGING_RESULT" = success
          test "$RIYADH_RESULT" = success
      - name: Enforce operational readiness gate
        run: bash scripts/verify-operational-readiness.sh
      - name: Upload readiness decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-readiness-${{ github.sha }}
          path: artifacts/reliability/operational-readiness.json
          if-no-files-found: error
