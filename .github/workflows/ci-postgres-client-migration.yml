name: CI PostgreSQL Client Migration

on:
  pull_request:
    paths:
      - .github/workflows/ci-postgres-client-migration.yml

permissions:
  contents: write

concurrency:
  group: ci-postgres-client-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: >-
      ${{
        github.repository == 'M-Qahtan/ros-road-operating-system' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'agent/runtime-production-readiness'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact runtime branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/runtime-production-readiness
          persist-credentials: true
      - name: Replace apt-based PostgreSQL client installation
        shell: python
        run: |
          from pathlib import Path

          def migrate(raw: str) -> None:
              path = Path(raw)
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              matches: list[int] = []
              for index in range(len(lines) - 1):
                  if (
                      lines[index].strip() == '- name: Install PostgreSQL client'
                      and lines[index + 1].strip()
                      == 'run: sudo apt-get update && sudo apt-get install -y postgresql-client'
                  ):
                      matches.append(index)
              if len(matches) != 1:
                  observed = [
                      line.rstrip('\n') for line in lines
                      if 'Install PostgreSQL client' in line or 'apt-get install -y postgresql-client' in line
                  ]
                  raise SystemExit(
                      f'{raw}: expected one structural PostgreSQL client step; '
                      f'found {len(matches)}; observed={observed!r}'
                  )

              index = matches[0]
              original = lines[index]
              indent = original[:len(original) - len(original.lstrip())]
              replacement = [
                  f'{indent}- name: Provide PostgreSQL client from pinned service image\n',
                  f'{indent}  run: bash scripts/setup-postgres-client-from-container.sh\n',
              ]
              lines[index:index + 2] = replacement
              path.write_text(''.join(lines), encoding='utf-8')

          migrate('.github/workflows/ci.yml')
          migrate('.github/workflows/operational-readiness.yml')
      - name: Restrict migration change surface
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- .github/workflows/ci.yml .github/workflows/operational-readiness.yml
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^\.github/workflows/(ci|operational-readiness)\.yml$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected changed paths:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          test -n "$(git status --porcelain -- .github/workflows/ci.yml .github/workflows/operational-readiness.yml)"
      - name: Commit workflow migration to draft branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ros-workflow-migration-bot"
          git config user.email "ros-workflow-migration-bot@users.noreply.github.com"
          git add .github/workflows/ci.yml .github/workflows/operational-readiness.yml
          git commit -m "ci: remove apt dependency from PostgreSQL readiness jobs"
          git push origin HEAD:agent/runtime-production-readiness
